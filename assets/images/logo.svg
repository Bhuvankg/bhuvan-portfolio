<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E7A9" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#F2D06B" />
    </linearGradient>
    <linearGradient id="goldSheen" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FFF2B2" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem / Crest Left -->
  <g transform="translate(15, 12)">
    <!-- Outer Shield / Diamond Frame -->
    <path d="M48 2 L90 48 L48 94 L6 48 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.85"/>
    <path d="M48 8 L84 48 L48 88 L12 48 Z" fill="#0D251A" stroke="url(#goldGrad)" stroke-width="1.2"/>
    
    <!-- Decorative Corner Dots -->
    <circle cx="48" cy="2" r="2.5" fill="url(#goldGrad)"/>
    <circle cx="90" cy="48" r="2.5" fill="url(#goldGrad)"/>
    <circle cx="48" cy="94" r="2.5" fill="url(#goldGrad)"/>
    <circle cx="6" cy="48" r="2.5" fill="url(#goldGrad)"/>

    <!-- Central Harvest & Flame Motif (Puthari Harvest symbol) -->
    <!-- Stalk / Corn / Grain Motif -->
    <path d="M48 24 C44 32 38 40 34 52 C42 49 46 44 48 36" fill="url(#goldGrad)" opacity="0.9"/>
    <path d="M48 24 C52 32 58 40 62 52 C54 49 50 44 48 36" fill="url(#goldGrad)" opacity="0.9"/>
    <path d="M48 36 C42 45 36 54 36 64 C42 61 46 56 48 48" fill="url(#goldGrad)" opacity="0.9"/>
    <path d="M48 36 C54 45 60 54 60 64 C54 61 50 56 48 48" fill="url(#goldGrad)" opacity="0.9"/>
    
    <!-- Central Royal Stem & Star -->
    <line x1="48" y1="20" x2="48" y2="76" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="48" cy="18" r="3.5" fill="url(#goldSheen)"/>
    
    <!-- Base Ribbon Accent -->
    <path d="M30 74 Q48 82 66 74 Q48 78 30 74 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography Right -->
  <g transform="translate(125, 20)">
    <!-- Small Top Tagline -->
    <text x="4" y="20" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="11" font-weight="600" fill="url(#goldGrad)" letter-spacing="4.5">
      KAMPALAPURA • FAMILY RESTAURANT
    </text>

    <!-- Main Title: PUTHARI -->
    <text x="0" y="58" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="38" font-weight="800" fill="#FFFFFF" letter-spacing="3.5">
      PUTHARI
    </text>

    <!-- Accent Word: RESTAURANT -->
    <text x="216" y="58" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="38" font-weight="400" fill="url(#goldGrad)" letter-spacing="4">
      RESTAURANT
    </text>

    <!-- Subtle Divider Line -->
    <line x1="2" y1="72" x2="385" y2="72" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.75"/>
    <circle cx="193" cy="72" r="2.5" fill="url(#goldGrad)"/>

    <!-- Bottom Subtitle / Highway corridor note -->
    <text x="4" y="86" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="10.5" font-weight="500" fill="#DDD1BA" letter-spacing="2.8">
      GREAT TASTE • WARM HOSPITALITY • BM ROAD
    </text>
  </g>
</svg>
