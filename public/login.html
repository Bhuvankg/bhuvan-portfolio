<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — GradeAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">
  <div class="bg-glow-top"></div>

  <div class="card" style="width: 100%; max-width: 440px; padding: 36px; z-index: 10;">
    <div style="text-align: center; margin-bottom: 28px;">
      <a href="/index.html" class="brand-logo" style="justify-content: center; margin-bottom: 12px;">
        <div class="brand-icon"><i data-lucide="sparkles"></i></div>
        <span>Grade<strong style="color: var(--primary);">AI</strong></span>
      </a>
      <h2>Welcome Back</h2>
      <p style="font-size: 0.9rem;">Sign in to your academic dashboard</p>
    </div>

    <form onsubmit="handleLoginSubmit(event)">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="login-email" class="form-input" required placeholder="teacher@gradeai.edu">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="login-password" class="form-input" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
        <i data-lucide="log-in"></i> Sign In
      </button>
    </form>

    <div style="margin: 24px 0 16px; border-top: 1px solid var(--border-color); padding-top: 20px; text-align: center;">
      <span style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase;">1-Click Demo Access</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <button class="btn btn-secondary btn-sm" onclick="demoLogin('teacher')">
        <i data-lucide="user-check"></i> Sign In as Teacher (Dr. Chen)
      </button>
      <button class="btn btn-secondary btn-sm" onclick="demoLogin('student1')">
        <i data-lucide="graduation-cap"></i> Sign In as Student (Alex)
      </button>
      <button class="btn btn-secondary btn-sm" onclick="demoLogin('admin')">
        <i data-lucide="shield"></i> Sign In as Administrator
      </button>
    </div>

    <div style="text-align: center; margin-top: 24px; font-size: 0.85rem;">
      <a href="/register.html" style="color: var(--primary);">Need an account? Register here</a> • <a href="/index.html" style="color: var(--text-muted);">Home</a>
    </div>
  </div>

  <div id="global-toast-container" class="toast-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>
  <script>
    async function demoLogin(role) {
      try {
        showToast(`Signing in as ${role}...`, 'info');
        await Auth.demoLogin(role);
        window.location.href = '/app.html';
      } catch (e) {
        showToast(e.message, 'danger');
      }
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-password').value;
      try {
        showToast('Authenticating...', 'info');
        await Auth.login(email, pass);
        window.location.href = '/app.html';
      } catch (err) {
        showToast(err.message, 'danger');
      }
    }
  </script>
</body>
</html>
