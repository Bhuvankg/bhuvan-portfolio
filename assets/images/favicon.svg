<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E28054" />
      <stop offset="100%" stop-color="#B24E25" />
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D59B" />
      <stop offset="100%" stop-color="#C5A059" />
    </linearGradient>
  </defs>

  <!-- Dark Espresso Background with Soft Rounded Rect -->
  <rect width="64" height="64" rx="14" fill="#14110E" stroke="url(#favGold)" stroke-width="1.8"/>

  <!-- Hexagonal Lozenge Border -->
  <path d="M32 5 L55 18 L55 46 L32 59 L9 46 L9 18 Z" fill="#1C1815" stroke="url(#favAccent)" stroke-width="1.2" opacity="0.9"/>

  <!-- Stylized Letter 'N' in Serif Gold -->
  <text x="32" y="44" 
        font-family="'Playfair Display', Georgia, serif" 
        font-size="34" 
        font-weight="800" 
        fill="url(#favGold)" 
        text-anchor="middle">
    N
  </text>

  <!-- Tiny Rising Aroma / Accent Dot -->
  <circle cx="32" cy="12" r="2.2" fill="#E28054"/>
</svg>
