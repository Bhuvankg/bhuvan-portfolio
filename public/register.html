<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Account — GradeAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">
  <div class="bg-glow-top"></div>

  <div class="card" style="width: 100%; max-width: 480px; padding: 36px; z-index: 10;">
    <div style="text-align: center; margin-bottom: 24px;">
      <a href="/index.html" class="brand-logo" style="justify-content: center; margin-bottom: 12px;">
        <div class="brand-icon"><i data-lucide="sparkles"></i></div>
        <span>Grade<strong style="color: var(--primary);">AI</strong></span>
      </a>
      <h2>Create Your Account</h2>
      <p style="font-size: 0.9rem;">Join university faculty and students on GradeAI</p>
    </div>

    <form onsubmit="handleRegisterSubmit(event)">
      <div class="form-group">
        <label class="form-label">Full Name *</label>
        <input type="text" id="reg-name" class="form-input" required placeholder="Elena Rostova">
      </div>
      <div class="form-group">
        <label class="form-label">Email Address *</label>
        <input type="email" id="reg-email" class="form-input" required placeholder="elena@university.edu">
      </div>
      <div class="form-group">
        <label class="form-label">Academic Role *</label>
        <select id="reg-role" class="form-select">
          <option value="student">Student Learner</option>
          <option value="teacher">Faculty Teacher / Instructor</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Academic Department</label>
        <input type="text" id="reg-dept" class="form-input" placeholder="Computer Science & Engineering">
      </div>
      <div class="form-group">
        <label class="form-label">Password * (Min 6 characters)</label>
        <input type="password" id="reg-password" class="form-input" required minlength="6" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
        <i data-lucide="user-plus"></i> Complete Registration
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 0.85rem;">
      <a href="/login.html" style="color: var(--primary);">Already have an account? Sign in</a> • <a href="/index.html" style="color: var(--text-muted);">Home</a>
    </div>
  </div>

  <div id="global-toast-container" class="toast-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>
  <script>
    async function handleRegisterSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const role = document.getElementById('reg-role').value;
      const department = document.getElementById('reg-dept').value;
      const password = document.getElementById('reg-password').value;

      try {
        showToast('Registering user account...', 'info');
        await Auth.register({ name, email, role, department, password });
        showToast('Account registered successfully!', 'success');
        setTimeout(() => { window.location.href = '/app.html'; }, 500);
      } catch (err) {
        showToast(err.message, 'danger');
      }
    }
  </script>
</body>
</html>
