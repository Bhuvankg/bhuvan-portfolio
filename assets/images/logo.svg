<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <!-- Warm Terracotta & Caramel Gradient -->
    <linearGradient id="noshAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E28054" />
      <stop offset="45%" stop-color="#D4683B" />
      <stop offset="100%" stop-color="#B24E25" />
    </linearGradient>

    <!-- Muted Gold / Caramel Shimmer -->
    <linearGradient id="noshGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D59B" />
      <stop offset="50%" stop-color="#D4AF60" />
      <stop offset="100%" stop-color="#A68032" />
    </linearGradient>

    <!-- Warm Cream Typography Fill -->
    <linearGradient id="noshCream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#F3E9DA" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Crest & Icon Emblem (Left) -->
  <g transform="translate(18, 12)">
    <!-- Elegant Outer Hexagonal Shield / Lozenge with Terracotta Stroke -->
    <path d="M48 3 L86 24 L86 72 L48 93 L10 72 L10 24 Z" 
          fill="#1C1815" 
          stroke="url(#noshGold)" 
          stroke-width="1.8" />
    
    <!-- Inner Accent Border -->
    <path d="M48 9 L80 27 L80 68 L48 87 L16 68 L16 27 Z" 
          fill="#14110E" 
          stroke="url(#noshAccent)" 
          stroke-width="1" 
          opacity="0.85" />

    <!-- Corner Decorative Accents -->
    <circle cx="48" cy="3" r="2.5" fill="url(#noshGold)" />
    <circle cx="86" cy="48" r="2" fill="url(#noshAccent)" />
    <circle cx="48" cy="93" r="2.5" fill="url(#noshGold)" />
    <circle cx="10" cy="48" r="2" fill="url(#noshAccent)" />

    <!-- Emblem Art: Stylized Coffee Cup + Dining Cloche + Rising Aroma -->
    <!-- Rising Aroma Curves -->
    <path d="M41 23 Q45 28 41 33" fill="none" stroke="url(#noshGold)" stroke-width="1.5" stroke-linecap="round" />
    <path d="M48 20 Q52 26 48 33" fill="none" stroke="url(#noshAccent)" stroke-width="1.8" stroke-linecap="round" />
    <path d="M55 23 Q59 28 55 33" fill="none" stroke="url(#noshGold)" stroke-width="1.5" stroke-linecap="round" />

    <!-- Modern Cafe Cup & Cloche Arc -->
    <path d="M30 38 L66 38 C66 52 59 62 48 62 C37 62 30 52 30 38 Z" 
          fill="url(#noshAccent)" 
          stroke="url(#noshGold)" 
          stroke-width="1.2" />

    <!-- Cup Handle -->
    <path d="M66 42 Q74 42 74 48 Q74 54 64 54" 
          fill="none" 
          stroke="url(#noshGold)" 
          stroke-width="1.6" 
          stroke-linecap="round" />

    <!-- Saucer / Dining Base Pedestal -->
    <path d="M26 65 Q48 70 70 65" 
          fill="none" 
          stroke="url(#noshGold)" 
          stroke-width="2" 
          stroke-linecap="round" />

    <!-- Tiny Warm Sparkle Star Underneath -->
    <path d="M48 72 L49.5 76 L53.5 76 L50 78.5 L51.5 82.5 L48 80 L44.5 82.5 L46 78.5 L42.5 76 L46.5 76 Z" 
          fill="url(#noshGold)" />
  </g>

  <!-- Typography (Right) -->
  <g transform="translate(132, 18)">
    <!-- Category & Destination Micro-Label -->
    <text x="3" y="20" 
          font-family="'Playfair Display', Georgia, serif" 
          font-size="11" 
          font-weight="600" 
          fill="url(#noshGold)" 
          letter-spacing="5">
      PANCHAVALLI • RESTAURANT &amp; CAFÉ
    </text>

    <!-- Main Wordmark: NOSH -->
    <text x="0" y="62" 
          font-family="'Playfair Display', 'Cinzel', Georgia, serif" 
          font-size="44" 
          font-weight="800" 
          fill="url(#noshCream)" 
          letter-spacing="3.5">
      NOSH
    </text>

    <!-- Descriptor: RESTO CAFE -->
    <text x="175" y="62" 
          font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
          font-size="28" 
          font-weight="300" 
          fill="url(#noshAccent)" 
          letter-spacing="6">
      RESTO CAFE
    </text>

    <!-- Refined Divider Line -->
    <line x1="2" y1="76" x2="390" y2="76" stroke="url(#noshGold)" stroke-width="1.2" opacity="0.65" />
    <circle cx="196" cy="76" r="2.5" fill="url(#noshAccent)" />

    <!-- Tagline & Highway Descriptor -->
    <text x="3" y="91" 
          font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
          font-size="10.5" 
          font-weight="500" 
          fill="#D6C8B5" 
          letter-spacing="2.8">
      GOOD FOOD • GREAT VIBES • THALASSERY–MYSORE ROAD
    </text>
  </g>
</svg>
